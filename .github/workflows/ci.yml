name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 测试 (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Dockerfile 用 npm ci，它要求 lock 与 package.json 严格同步。
      # 一旦有人改了 package.json 忘了跟着更新 lock，镜像构建会失败——
      # 那时才发现太晚了，所以在最便宜的 job 里先拦一道。
      - name: 校验 lock 文件与 package.json 同步
        run: npm ci --dry-run --no-audit --no-fund

      # 可选依赖（飞书/QQ官方/钉钉 SDK、puppeteer-core）在 CI 中不需要，
      # 跳过它们可显著加快安装且避免网络波动导致的假失败。
      - name: 安装依赖
        run: npm install --no-audit --no-fund --omit=optional

      - name: 语法检查
        run: |
          for f in index.js server/**/*.js plugins/*/index.js; do
            [ -f "$f" ] && node --check "$f" || true
          done

      - name: 运行测试
        run: npm test

  # 上面的 test job 用 --omit=optional，所以 test/platform-adapters.test.js 里的
  # "契约"用例全被跳过。那些用例才是真正核对适配器与平台 SDK 是否对得上的地方
  # （intent 名字、构造参数、ack 方式），必须有一处把可选依赖装全后跑一遍，
  # 否则 SDK 发新版改了接口我们无从知晓。
  sdk-contract:
    name: 平台 SDK 契约
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装全部依赖（含可选平台 SDK）
        run: npm ci --no-audit --no-fund

      - name: 确认三个平台 SDK 真的装上了
        run: |
          for p in @larksuiteoapi/node-sdk qq-official-bot dingtalk-stream; do
            [ -d "node_modules/$p" ] || { echo "❌ $p 未安装"; exit 1; }
            echo "✅ $p"
          done

      - name: 运行适配器契约测试
        run: node --test --test-force-exit test/platform-adapters.test.js

  docker:
    name: 镜像构建与容器冒烟
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # env_file 用的是短语法（兼容 Compose < 2.24），它要求 .env 必须存在。
      # 部署第一步就是 cp .env.example .env，CI 里照做。
      - name: 校验 compose 文件
        run: |
          cp .env.example .env
          docker compose config > /dev/null
          docker compose --profile napcat config > /dev/null
          rm -f .env

      - name: 构建镜像
        run: docker build -t stgw:ci .

      # 真容器里跑一遍：验证 0.0.0.0 绑定、鉴权、健康检查、
      # 以及"env 注入的凭据不落盘"这条关键不变量。
      - name: 容器冒烟
        run: |
          # 用**空的、root 属主**的宿主目录挂载，复现最容易出问题的场景：
          # bind mount 覆盖镜像目录 + 属主不是 uid1000。
          # entrypoint 必须能把内置插件补回来并修正属主。
          mkdir -p /tmp/vol/config /tmp/vol/data /tmp/vol/logs /tmp/vol/assets /tmp/vol/plugins

          docker run -d --name stgw \
            -e GATEWAY_AUTH_TOKEN=ci-test-token \
            -e GATEWAY_TELEGRAM_BOT_TOKEN=ci-secret-token \
            -e TZ=Asia/Shanghai \
            -v /tmp/vol/config:/app/config \
            -v /tmp/vol/data:/app/data \
            -v /tmp/vol/logs:/app/logs \
            -v /tmp/vol/assets:/app/assets \
            -v /tmp/vol/plugins:/app/plugins \
            -p 127.0.0.1:3210:3210 \
            stgw:ci

          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:3210/api/gateway/health > /dev/null; then break; fi
            sleep 1
          done

          if ! curl -sf http://127.0.0.1:3210/api/gateway/health > /dev/null; then
            echo "❌ 容器未在 40s 内就绪"; docker logs stgw; exit 1
          fi
          echo "✅ 健康检查通过"

          CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3210/api/gateway/status)
          [ "$CODE" = "401" ] || { echo "❌ 未鉴权应返回 401，实际 $CODE"; docker logs stgw; exit 1; }
          echo "✅ 鉴权生效"

          CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "X-Gateway-Token: ci-test-token" http://127.0.0.1:3210/api/gateway/status)
          [ "$CODE" = "200" ] || { echo "❌ 带 env token 应返回 200，实际 $CODE"; docker logs stgw; exit 1; }
          echo "✅ 环境变量注入的 token 生效"

          # 关键不变量：env 注入的凭据绝不能出现在挂载卷的配置文件里。
          #
          # 光 grep 是**空断言**：config.js 的 load() 里 save() 发生在 _applyEnv()
          # 之前，而冒烟流程只做 GET，之后再没有任何东西触发过 save()。
          # 也就是说容器里的 gateway.json 物理上就是一份纯默认配置，
          # 把 _configForPersist() 那套还原逻辑整个删掉，这条也照样打勾。
          # 所以必须先强制触发一次「env 生效之后」的写盘，再验。
          curl -sf -X POST http://127.0.0.1:3210/api/gateway/config \
            -H "X-Gateway-Token: ci-test-token" -H 'Content-Type: application/json' \
            -d '{"session":{"maxHistoryLength":77}}' > /dev/null || {
              echo "❌ 触发写盘的请求失败"; docker logs stgw; exit 1; }

          # 正断言：文件确实被重写过（否则下面的 grep 又退化成空断言）
          docker exec stgw grep -q '"maxHistoryLength": 77' /app/config/gateway.json || {
            echo "❌ 配置文件未被重写，凭据断言无意义"; exit 1; }
          # 负断言：env 注入的凭据不在其中
          if docker exec stgw grep -q "ci-secret-token" /app/config/gateway.json; then
            echo "❌ 环境变量注入的凭据被写入了配置文件"; exit 1
          fi
          echo "✅ env 生效后写盘，凭据仍未落盘"

          # bind mount 覆盖陷阱：空挂载卷不能让内置插件消失
          COUNT=$(docker exec stgw sh -c 'ls /app/plugins | wc -l')
          [ "$COUNT" -ge 5 ] || {
            echo "❌ 内置插件未被补入挂载卷（当前 $COUNT 个）"; docker logs stgw; exit 1; }
          docker exec stgw test -d /app/plugins/regex-filter || {
            echo "❌ 内置插件 regex-filter 缺失"; exit 1; }
          echo "✅ 内置插件已补入空挂载卷 ($COUNT 个)"

          # 卷权限：以 root 属主的宿主目录挂进来后，容器内必须仍能写
          docker exec stgw sh -c 'test -w /app/data && test -w /app/config' || {
            echo "❌ 挂载卷不可写（entrypoint 的属主修正失效）"; docker logs stgw; exit 1; }
          echo "✅ 挂载卷可写"

          # 镜像宣称"可选平台 SDK 默认已装"，验证它确实装了。
          # 这三个是 optionalDependencies——版本范围写错时 npm 会静默跳过，
          # 用户只会在启用平台时看到"未安装 SDK"，构建阶段毫无征兆。
          for p in @larksuiteoapi/node-sdk qq-official-bot dingtalk-stream; do
            docker exec stgw test -d "/app/node_modules/$p" || {
              echo "❌ 可选平台 SDK $p 未装进镜像"; exit 1; }
          done
          echo "✅ 三个可选平台 SDK 均已装入镜像"

          # 取 token 的正规途径必须在容器里能用（日志是脱敏的，从那儿取不到）
          docker exec stgw npm run token --silent > /tmp/tok.txt 2>/dev/null || {
            echo "❌ npm run token 执行失败"; exit 1; }
          grep -qx "ci-test-token" /tmp/tok.txt || {
            echo "❌ npm run token 输出与注入的 token 不符: $(cat /tmp/tok.txt)"; exit 1; }
          echo "✅ npm run token 可取回环境变量注入的 token"

          # 最终运行身份必须是非 root（entrypoint 以 root 起，但要降权）。
          # 不用 ps：node:22-slim 不含 procps，`ps` 根本不存在，
          # 原来的 `2>/dev/null || true` 会把 "ps: not found" 吞掉，
          # 断言恒失败且报错指向 gosu，排查方向完全错。改成读 /proc，零依赖。
          RUNAS=$(docker exec stgw sh -c '
            for p in /proc/[0-9]*; do
              [ "$(cat $p/comm)" = node ] || continue
              stat -c %u "$p"; exit 0
            done
            echo NOTFOUND; exit 1
          ')
          echo "node 进程 uid=$RUNAS"
          [ "$RUNAS" != "0" ] && [ "$RUNAS" != "NOTFOUND" ] || {
            echo "❌ node 进程应以非 root 运行，实际 uid='$RUNAS'"; docker logs stgw; exit 1; }
          echo "✅ 已降权到非 root 运行 (uid=$RUNAS)"

          # TZ 生效（装了 tzdata 才行）
          TZOUT=$(docker exec stgw date +%Z)
          echo "容器时区: $TZOUT"

          # HEALTHCHECK 指令本身是否被 Docker 判定为健康
          for i in $(seq 1 30); do
            H=$(docker inspect -f '{{.State.Health.Status}}' stgw 2>/dev/null || echo none)
            [ "$H" = "healthy" ] && break
            sleep 2
          done
          [ "$H" = "healthy" ] || { echo "❌ HEALTHCHECK 未转为 healthy（当前 $H）"; docker logs stgw; exit 1; }
          echo "✅ HEALTHCHECK 正常"

          # 优雅关闭：docker stop 应在超时前退出（验证 tini 转发 SIGTERM）
          START=$(date +%s)
          docker stop stgw > /dev/null
          ELAPSED=$(( $(date +%s) - START ))
          [ "$ELAPSED" -lt 8 ] || { echo "❌ 关闭耗时 ${ELAPSED}s，SIGTERM 可能未被处理"; exit 1; }
          echo "✅ 优雅关闭 (${ELAPSED}s)"

      # 单独起一个不给 token 的容器，覆盖"首次启动自动生成"这条路径。
      # 这正是之前坏掉的场景：token 自动生成了，但日志脱敏把它抹成
      # <redacted-hex>，而文档却让用户去日志里找——等于永远拿不到。
      - name: 容器冒烟（自动生成 token 的路径）
        run: |
          mkdir -p /tmp/vol2/config
          docker run -d --name stgw2 \
            -v /tmp/vol2/config:/app/config \
            -p 127.0.0.1:3211:3210 \
            stgw:ci

          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:3211/api/gateway/health > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:3211/api/gateway/health > /dev/null || {
            echo "❌ 容器未就绪"; docker logs stgw2; exit 1; }

          TOKEN=$(docker exec stgw2 npm run token --silent)
          [ "${#TOKEN}" -eq 48 ] || {
            echo "❌ 未取到自动生成的 token（长度 ${#TOKEN}）"; docker logs stgw2; exit 1; }
          echo "✅ 自动生成的 token 可通过 npm run token 取回"

          CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "X-Gateway-Token: $TOKEN" http://127.0.0.1:3211/api/gateway/status)
          [ "$CODE" = "200" ] || { echo "❌ 取回的 token 无效，返回 $CODE"; exit 1; }
          echo "✅ 取回的 token 可通过鉴权"

          # 反向验证：这个 token 绝不能出现在日志里（用户贴日志求助时会泄露）
          if docker logs stgw2 2>&1 | grep -q "$TOKEN"; then
            echo "❌ 鉴权 token 明文出现在日志中"; exit 1
          fi
          echo "✅ token 未泄露到日志"

      - name: 失败时输出容器日志
        if: failure()
        run: |
          docker logs stgw || true
          docker logs stgw2 || true

  smoke:
    name: 启动冒烟
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm install --no-audit --no-fund --omit=optional

      # 默认配置（无任何凭据）下必须能正常启动并响应健康检查。
      # 这道关卡能挡住"改坏了启动流程"这类最致命的回归。
      - name: 默认配置启动并探活
        run: |
          node server/index.js > /tmp/gw.log 2>&1 &
          GW=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3210/api/gateway/health > /dev/null; then
              echo "✅ 健康检查通过"
              break
            fi
            sleep 1
          done

          if ! curl -sf http://127.0.0.1:3210/api/gateway/health > /dev/null; then
            echo "❌ 服务未能在 30s 内就绪"
            cat /tmp/gw.log
            kill $GW 2>/dev/null || true
            exit 1
          fi

          # 未授权访问必须被拒（P0 鉴权加固的回归保护）
          CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3210/api/gateway/status)
          kill $GW 2>/dev/null || true
          if [ "$CODE" != "401" ]; then
            echo "❌ /api/gateway/status 未鉴权时应返回 401，实际 $CODE"
            cat /tmp/gw.log
            exit 1
          fi
          echo "✅ 鉴权保护生效 (401)"

          # 启动日志中不应出现未捕获异常
          if grep -qE "UnhandledPromiseRejection|uncaughtException" /tmp/gw.log; then
            echo "❌ 启动日志存在未捕获异常"
            cat /tmp/gw.log
            exit 1
          fi
          echo "✅ 无未捕获异常"
