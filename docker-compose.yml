# SillyTavern Multi-Platform Gateway —— 一键部署
#
#   cp .env.example .env   # 填入你的 bot token 等
#   docker compose up -d
#
# 可选组件用 profile 控制，默认不启动：
#   docker compose --profile napcat up -d    # 额外拉起 NapCat（QQ OneBot 实现）

# 两个服务共用同一套日志轮转设置
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  gateway:
    build: .
    image: sillytavern-gateway:latest
    container_name: st-gateway
    restart: unless-stopped

    # ⚠️ 端口绑定安全
    # 默认只绑宿主机回环（127.0.0.1），因为网关持有你全部平台的 bot token，
    # 一旦暴露到公网，即便有鉴权也是不必要的攻击面。
    # 需要从其它机器访问时**不要改这个文件**（它受 git 跟踪，下次拉代码会冲突
    # 或被改回去）——在 .env 里设 GATEWAY_BIND_ADDR 即可：
    #   局域网：GATEWAY_BIND_ADDR=192.168.1.10   ← 绑具体网卡，别用 0.0.0.0
    #   公 网：见 docs/DEPLOYMENT.md 第四节（注意 ufw 管不住 Docker 发布的端口）
    ports:
      - "${GATEWAY_BIND_ADDR:-127.0.0.1}:${GATEWAY_PORT:-3210}:3210"

    # 配置全部来自环境变量（见 .env.example）。
    # 敏感项不会被写进 config/gateway.json —— 见 server/utils/env-config.js
    # 用字符串短语法而非 `path:/required:` 长语法：
    # required 是 Compose v2.24(2024-01) 才加的，老版本不是降级而是
    # `services.gateway.env_file.0 must be a string` 直接 schema 报错，
    # up/down/config 全部命令都起不来。Debian 12 源里的 compose、
    # 各家 NAS 自带的 compose 大多还停在 2.24 之前。
    # 而部署第一步就是 cp .env.example .env，.env 必然存在，不需要 required。
    env_file:
      - .env
    environment:
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 3210
      TZ: ${TZ:-Asia/Shanghai}

    volumes:
      # 配置与运行时状态（必须持久化，否则重启丢会话/丢存档/token 重新生成）
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
      # ST 资产：角色卡 / 世界书 / 预设（自建推理管线用）。
      # 把你在 SillyTavern 里做好的资产拷进宿主机的 ./assets 即可。
      - ./assets:/app/assets
      # 插件目录：挂出来便于装第三方插件后持久保留
      - ./plugins:/app/plugins

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3210/api/gateway/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    # 让容器内可用 host.docker.internal 访问宿主机上的
    # SillyTavern / NapCat / Ollama 等服务（Linux 上默认没有这个名字）
    extra_hosts:
      - "host.docker.internal:host-gateway"

    logging: *default-logging

    # 插件是在网关主进程里 import() 执行的（没有 worker/vm 隔离），
    # 而 plugins/ 正是文档鼓励用户丢第三方代码的挂载卷。
    # 没有配额时，一个内存泄漏或写错循环的插件撑爆的是**宿主机**内存，
    # OOM killer 挑中的可能是宿主机上别的进程。降权只防提权，不防资源耗尽。
    mem_limit: ${GATEWAY_MEM_LIMIT:-1g}
    pids_limit: ${GATEWAY_PIDS_LIMIT:-512}
    security_opt:
      - no-new-privileges:true

  # ─────────────────────────────────────────────────────────
  # 可选：NapCat（QQ OneBot v11 实现）
  #   docker compose --profile napcat up -d
  # 首次启动需要看日志扫码登录：docker compose logs -f napcat
  # 登录态持久化在 ./napcat/qq，之后重建容器不用重新扫码。
  # ─────────────────────────────────────────────────────────
  napcat:
    profiles: ["napcat"]
    image: mlikiowa/napcat-docker:latest
    container_name: st-napcat
    restart: unless-stopped
    environment:
      # 填你的 QQ 号；留空则每次启动都要扫码
      ACCOUNT: ${NAPCAT_ACCOUNT:-}
      # 开启正向 WebSocket。镜像的 entrypoint 是靠 MODE 选模板：
      #   cp /app/templates/$$MODE.json /app/napcat/config/onebot11.json
      # ws.json 里监听 0.0.0.0:3001，正好对上 GATEWAY_QQ_WS_URL=ws://napcat:3001。
      # （早期 napcat-docker 的那个 WS 开关变量现行镜像已经不认了，设了没用，
      #   3001 上不会有任何东西监听，表现为网关无限重连。）
      MODE: ws
      # entrypoint 里 `: ${NAPCAT_UID:=0}` 默认取 0，然后 chown -R 0:0 /app，
      # 会把宿主机 ./napcat/* 变成 root 属主，普通用户备份/清理时撞权限。
      NAPCAT_UID: ${NAPCAT_UID:-1000}
      NAPCAT_GID: ${NAPCAT_GID:-1000}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      # NapCat WebUI（仅回环，不对外）
      - "127.0.0.1:6099:6099"
    volumes:
      - ./napcat/config:/app/napcat/config
      # 镜像里 napcat 用户的 HOME 是 /app，QQ 写的是 /app/.config/QQ。
      # 挂到 root 家目录下那个路径是错的——没有任何进程会写它，
      # 登录态完全不持久化，每次 up --build / down 之后都要重新扫码。
      - ./napcat/qq:/app/.config/QQ
    # NapCat + LinuxQQ 的 stdout 很吵，不限制的话 json-file 会无上限增长，
    # 跑几周能吃掉几个 GB —— 在 NAS 这类小系统盘上会把宿主机写死。
    logging: *default-logging
    mem_limit: ${NAPCAT_MEM_LIMIT:-2g}
    # 与网关同网络，网关侧用 ws://napcat:3001 连接
    # （对应 GATEWAY_QQ_WS_URL=ws://napcat:3001）

networks:
  default:
    name: st-gateway-net
